
name: Build Solucan Arena APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get game files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Prepare Android project
        run: |
          mkdir -p www
          cp solucan-arena-1.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init "Solucan Arena" "com.reislexno.solucanarena" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: solucan-arena-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
